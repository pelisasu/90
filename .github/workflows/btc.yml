name: btc eth

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Paksa eksekusi manual"
        required: false
        default: "true"
        type: string

permissions:
  contents: read
  actions: write

jobs:
  hyperion-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore State & Database Cache
        id: cache-state
        uses: actions/cache@v4
        with:
          path: |
            trading_signals.db
            backtest_performance.png
          key: hyperion-state-${{ github.run_id }}
          restore-keys: |
            hyperion-state-

      - name: Run Signal Bot Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACCOUNT_BALANCE: "10000.0"
          RISK_PERCENT: "1.0"
          SQLITE_DB_PATH: "trading_signals.db"
          BACKTEST_CHART_PATH: "backtest_performance.png"
        run: python -u btc.py

      - name: Upload State & Backtest Chart Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hyperion-state-and-chart
          path: |
            trading_signals.db
            backtest_performance.png
          if-no-files-found: warn
          retention-days: 14
