name: APEX-QUANT-OMNI Crypto Signal Bot

on:
  schedule:
    # Jalankan setiap 15 menit (menit ke-1, 16, 31, 46) setelah candle 15m/1h/4h tutup
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:

jobs:
  run-signal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Restore Deduplication State
        uses: actions/cache@v4
        with:
          path: apex_state.json
          key: apex-state-${{ github.run_id }}
          restore-keys: |
            apex-state-

      - name: Run Signal Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OFFSET_BTCUSD: ${{ vars.OFFSET_BTCUSD || '0.0' }}
          OFFSET_ETHUSD: ${{ vars.OFFSET_ETHUSD || '0.0' }}
        run: python -u btc.py
