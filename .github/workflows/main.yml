name: APEX-QUANT-OMNI XAUUSD Signal Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [telegram_check]
  workflow_dispatch:
    inputs:
      command:
        description: "Mode eksekusi manual (auto / check / scalp / swing / status / chart / history)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - check
          - scalp
          - swing
          - status
          - chart
          - history

permissions:
  contents: read

concurrency:
  group: apex-quant-omni-xauusd
  cancel-in-progress: false

jobs:
  run-signal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore SQLite State & Persistence Cache
        uses: actions/cache@v4
        with:
          path: trading_signals.db
          key: apex-quant-state-${{ github.run_id }}
          restore-keys: |
            apex-quant-state-

      - name: Execute APEX-QUANT-OMNI Engine
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE || '10000.0' }}
          RISK_PER_TRADE_PCT: ${{ vars.RISK_PER_TRADE_PCT || '1.0' }}
          SPREAD_USD: ${{ vars.SPREAD_USD || '0.30' }}
          SLIPPAGE_USD: ${{ vars.SLIPPAGE_USD || '0.10' }}
          BOT_COMMAND: ${{ github.event.inputs.command || github.event.client_payload.command || 'auto' }}
        run: |
          python -u bot.py

      - name: Upload State DB & Backtest Performance Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-quant-artifacts-${{ github.run_number }}
          path: |
            trading_signals.db
            backtest_performance.png
          retention-days: 14
